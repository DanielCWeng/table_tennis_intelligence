name: Live Mode and offline regression
on:
  pull_request:
  push:
    branches:
      - feat/live-mode-motionsync-integration
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional live UI and test dependencies
        run: python -m pip install -e ".[dev,live]"
      - name: Existing offline and new live regression tests
        run: python -m pytest -q
      - name: Synthetic analysis-only benchmark
        run: python -m ttintel.live.benchmark --frames 180 --json live-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-benchmark-${{ matrix.os }}
          path: live-benchmark.json
