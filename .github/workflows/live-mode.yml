name: Live Mode and offline regression
on:
  pull_request:
  push:
    branches:
      - feat/live-mode-motionsync-integration
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install optional live UI and offline test dependencies
        run: python -m pip install -e ".[dev,live,render,media]"
      - name: Construct the missing local video as an explicitly synthetic CI fixture
        run: python scripts/create_ci_video_fixture.py
      - name: Existing offline and new live regression tests
        run: python -m pytest -q
      - name: Synthetic analysis-only benchmark
        run: python -m ttintel.live.benchmark --frames 180 --json live-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-benchmark-${{ matrix.os }}
          path: live-benchmark.json
