<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TT Intel - Frame Labeller</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='labeller.css') }}">
</head>
<body>
  <header class="bar header-strip">
    <strong>TT Intel / Frame Labeller</strong>
    <span id="video-name">Loading frames...</span>
    <span id="header-frame">Frame <span id="frame-id">-</span> of <span id="total-frames">-</span></span>
  </header>

  <section class="bar control-strip" aria-label="Controls">
    <label>Overlay
      <select id="overlay-select">
        <option value="detections">detections</option>
        <option value="table">table corners</option>
        <option value="ball">ball only</option>
        <option value="none" selected>none</option>
      </select>
    </label>
    <label>Labelling mode
      <select id="mode-select">
        <option value="ball" selected>ball</option>
        <option value="corners">corners</option>
      </select>
    </label>
    <span class="key human-key"><i></i>human labels</span>
    <span class="key model-key"><i></i>model output</span>
    <label class="zoom-control">Zoom
      <input id="zoom" type="range" min="1" max="4" value="1" step="0.25" aria-label="Zoom">
      <span id="zoom-value">1x</span>
    </label>
    <button id="tracker-button" type="button">compute tracker</button>
    <span id="tracker-status">tracker off at startup</span>
    <span class="storage-hint">labels: <code id="labels-path">-</code> | corners: <code id="corners-path">-</code></span>
  </section>

  <main class="frame-area">
    <div class="canvas-wrap">
      <canvas id="frame-canvas" width="960" height="540" aria-label="Video frame labelling canvas"></canvas>
      <div class="canvas-hint" id="canvas-hint">Click the ball; press N when it is not visible</div>
    </div>
    <p id="instruction">Place the label at the ball centre. Click again to replace.</p>
    <p id="last-action">Ready.</p>
  </main>

  <footer class="bar footer-strip">
    <button id="prev-frame" type="button" title="Previous frame (left arrow)">prev</button>
    <button id="next-frame" type="button" title="Next frame (right arrow)">next</button>
    <button id="absent-button" type="button">no ball visible (N)</button>
    <input id="scrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Frame scrubber">
    <span id="frame-count">- / -</span>
    <span class="counts">labels <strong id="labelled-count">0</strong> | points <strong id="point-count">0</strong> | no ball <strong id="absent-count">0</strong> | untouched <strong id="untouched-count">0</strong></span>
  </footer>
  <script src="{{ url_for('static', filename='labeller.js') }}"></script>
</body>
</html>
